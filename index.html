<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YodoProtect - Plateforme No-Code de Bot Discord</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
        }
        header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #30363d;
            margin-bottom: 30px;
        }
        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #58a6ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            align-items: start;
        }
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
        /* Section Mascotte Yodo */
        .mascot-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            position: relative;
        }
        .mascot-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #58a6ff;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(88, 166, 255, 0.2);
        }
        .speech-bubble {
            background: #21262d;
            border: 1px solid #30363d;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            color: #e6edf3;
            position: relative;
            text-align: left;
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 0 10px 10px 10px;
            border-style: solid;
            border-color: transparent transparent #21262d transparent;
        }
        /* Panneau Principal / Dashboard */
        .dashboard-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 30px;
        }
        h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #f0f6fc;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #8b949e;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #58a6ff;
        }
        .btn {
            background: #238636;
            color: #white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #2ea043;
        }
        .status-box {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            display: none;
        }
        .status-success {
            background: rgba(35, 134, 54, 0.15);
            border: 1px solid #238636;
            color: #3fb950;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            🦁 YodoProtect
        </div>
        <div style="font-size: 14px; color: #8b949e;">v1.0.0 Production</div>
    </header>

    <div class="container">
        <!-- Section Mascotte -->
        <div class="mascot-card">
            <!-- Nouvelle image mascotte lion moderne et stylée -->
            <img src="https://images.unsplash.com/photo-1534188753412-3e26d0d618d6?w=500&auto=format&fit=crop&q=60" alt="Yodo Mascot" class="mascot-img">
            <div class="speech-bubble" id="yodo-dialogue">
                Salut ! Je suis <strong>Yodo</strong>, ton assistant personnel. Entre ton token de bot Discord pour configurer ta sécurité en un clic !
            </div>
        </div>

        <!-- Section Configuration / Dashboard -->
        <div class="dashboard-card">
            <h2>Création & Configuration du Bot</h2>
            <div class="form-group">
                <label for="bot-token">Token du Bot Discord</label>
                <input type="text" id="bot-token" placeholder="Colle ton token secret ici...">
            </div>
            <div class="form-group">
                <label for="bot-prefix">Nom ou Préfixe</label>
                <input type="text" id="bot-prefix" placeholder="Ex: MonBotSecurise">
            </div>
            <button class="btn" onclick="validateBot()">Lancer le Bot sur Render</button>
            
            <div id="status-box" class="status-box">
                ✅ Token valide ! Transmission au backend Render en cours...
            </div>
        </div>
    </div>

    <script>
        function validateBot() {
            const tokenInput = document.getElementById('bot-token').value;
            const statusBox = document.getElementById('status-box');
            const dialogue = document.getElementById('yodo-dialogue');

            if(tokenInput.length > 20) {
                statusBox.style.display = 'block';
                dialogue.innerHTML = "Incroyable ! Ton token a l'air parfait. Je m'occupe de le lier à ton backend Render ! 🚀";
            } else {
                alert("Oups, ce token semble trop court ou invalide !");
                dialogue.innerHTML = "Attention moussaillon, vérifie bien ton token Discord !";
            }
        }
    </script>

</body>
</html>
