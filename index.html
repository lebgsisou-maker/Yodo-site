<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YodoProtect - Site en Maintenance</title>
    <style>
        :root {
            --bg-color: #070913;
            --card-bg: #0f172a;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
            --discord: #5865F2;
            --discord-hover: #4752C4;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .maintenance-container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 3rem 2rem;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
        }
        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 1rem;
            color: var(--text-main);
        }
        p {
            color: var(--text-muted);
            line-height: 1.6;
            font-size: 1rem;
            margin-bottom: 2rem;
        }
        .badge-maintenance {
            display: inline-block;
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent);
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }
        .btn-discord {
            background: var(--discord);
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 10px;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: background 0.2s;
            font-size: 0.95rem;
        }
        .btn-discord:hover {
            background: var(--discord-hover);
        }
    </style>
</head>
<body>

    <div class="maintenance-container">
        <div class="logo">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            YodoProtect
        </div>

        <div>
            <span class="badge-maintenance">🛠️ Site en Maintenance</span>
        </div>

        <h1>Nous faisons peau neuve</h1>
        <p>Notre plateforme est actuellement indisponible le temps d'optimiser l'interface et d'assurer une compatibilité totale sur tous les appareils. Revenez très vite !</p>

        <a href="https://discord.gg/upbS8cvNSB" target="_blank" class="btn-discord">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2z"></path><line x1="9" y1="12" x2="15" y2="12"></line></svg>
            Rejoindre le Discord en attendant
        </a>
    </div>

</body>
</html>
